paths:
  /api/Merchant/Register:
    post:
      summary: Register Merchant
      description: |
        Merchant registration for payment split.
      operationId: Register
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_0
            examples:
              Template:
                summary: Example Template
                value: *ref_1
              RegisterRegistrationMinimalPF:
                summary: Registration PF (Minimal)
                value: *ref_2
              RegisterRegistrationMinimalPJ:
                summary: Registration PJ (Minimal)
                value: *ref_3
              RegisterRegistrationTypicalPF:
                summary: Registration PF (Typical)
                value: *ref_4
              RegisterRegistrationTypicalPJ:
                summary: Registration PJ (Typical)
                value: *ref_5
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: *ref_6
              examples:
                Template:
                  summary: Example Template
                  value: *ref_7
                RegisterRegistrationMinimalPF:
                  summary: Registration PF (Minimal)
                  value: *ref_8
                RegisterRegistrationMinimalPJ:
                  summary: Registration PJ (Minimal)
                  value: *ref_9
  /api/Merchant/GetMerchant:
    post:
      summary: Get Merchant
      description: Get details about a specific merchant.
      operationId: GetMerchant
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_10
            examples:
              Template:
                summary: Example Template
                value: *ref_11
              GetPF:
                summary: Get PF
                value: *ref_12
              GetPJ:
                summary: Get PJ
                value: *ref_13
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: *ref_14
              examples:
                Template:
                  summary: Example Template
                  value: *ref_15
                GetPJ:
                  summary: Get PJ
                  value: *ref_16
                GetPF:
                  summary: Get PF
                  value: *ref_17
  /api/Merchant/GetMerchantSummary:
    post:
      summary: Get Merchant Summary
