                    nullable: true
                  payerBankAccountNumber:
                    type: string
                    description: Payer bank account number.
                    nullable: true
                  comprovante:
                    type: string
                    description: Payment receipt reference.
                    nullable: true
              financialContract:
                type: object
                description: Financial contract (receivable) details linked to this schedule.
                nullable: true
                properties:
                  legalDocument:
                    type: integer
                    description: Legal document number of the contract holder.
                    format: int64
                    nullable: true
                  cardBrandId:
                    type: integer
                    description: Card brand identifier for the receivable.
                    format: int16
                    nullable: true
                  effectType:
                    type: string
                    description: Effect type of the financial contract.
                    format: char
                    nullable: true
                  bankCode:
                    type: string
                    description: Bank code for the contract.
                    nullable: true
                  accountTypeId:
                    type: string
                    description: Account type identifier.
                    format: char
                    nullable: true
                  agency:
                    type: string
                    description: Bank agency for the contract.
                    nullable: true
                  account:
                    type: string
                    description: Bank account for the contract.
                    nullable: true
                  createdDate:
                    type: string
                    description: Date the financial contract was created.
                    format: date-time
                    nullable: true
                  beneficiaryLegalDocument:
                    type: integer
                    description: Legal document of the beneficiary.
                    format: int64
                    nullable: true
        code:
          type: integer
          description: >-
            Numeric code that states if the execution was successful or not.
            Positive numbers mean success, negative numbers indicate failures.
            Please refer to the [message code
            table](/api/tuna-codes#message-code-list) for a detailed list of all
            possible values.
          format: int32
    ConsolidatedStatementResponseSchema:
      type: object
      properties: &ref_36
        todayAmount:
          type: number
          description: The amount to be received today.
          format: double
          nullable: true
        futureAmount:
          type: number
          description: The confirmed amount to be received in the next days.
          format: double
          nullable: true
        pendingAmount:
          type: number
          description: >-
            The amount from pending transactions, i.e., waiting to change the
            status (e.g. cancelations and in analysis).
          format: double
          nullable: true
        doneAmount:
          type: number
          description: Amount settled in the applicable period.
          format: double
          nullable: true
