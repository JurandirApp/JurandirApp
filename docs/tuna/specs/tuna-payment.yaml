                format: double
              interest:
                type: number
                description: >-
                  Interest amount charged for the installment plan used by this
                  payment method. Only returned when **MessageDetails** is true.
                format: double
                nullable: true
              authorizerNsu :
                type: string
                description: >-
                  Authorizer nsu for this payment method.
                nullable: true
              authorizationCode:
                type: string
                description: >-
                  Authorization code returned by the acquirer. Only returned
                  when **MessageDetails** is true.
                nullable: true
              captureNsu  :
                type: string
                description: >-
                  Capture nsu for this payment method.
                nullable: true
              installments   :
                type: number
                description: >-
                  Number of installments in this payment method.
                format: int16
              transactionId   :
                type: string
                description: >-
                  Acquirer transaction id associated with this payment method.
                nullable: true
              bin   :
                type: string
                description: >-
                  Card bin if this payment method is for a card (credit or debit) transaction
                nullable: true
              last4:
                type: string
                description: >-
                  Card's last 4 digits, if this payment method is a card (credit
                  or debit) transaction. Only returned when **MessageDetails**
                  is true.
                nullable: true
              numberMasked:
                type: string
                description: >-
                  Masked card number (bin + last 4 digits). Only returned when
                  **MessageDetails** is true.
                nullable: true
              brandName    :
                type: string
                description: >-
                  Card brand if this payment method is for a card (credit or debit) transaction
                nullable: true
              holderName:
                type: string
                description: >-
                  Cardholder name as printed on the card. Only returned when
                  **MessageDetails** is true.
                nullable: true
              tokenProvider:
                type: string
                description: >-
                  The name of the tokenization provider used for this payment
                  method. Only returned when **MessageDetails** is true.
                nullable: true
              expirationMonth:
                type: integer
                description: >-
                  Card expiration month. Only returned when **MessageDetails**
                  is true.
                format: int16
                nullable: true
              expirationYear:
                type: integer
                description: >-
                  Card expiration year. Only returned when **MessageDetails**
                  is true.
                format: int16
                nullable: true
              isVoucher:
                type: boolean
                description: >-
                  Whether the card used is a voucher (meal/food benefit) card.
                  Only returned when **MessageDetails** is true.
                nullable: true
              hasNetworkToken:
                type: boolean
                description: >-
                  Whether the transaction used a network token. Only returned
                  when **MessageDetails** is true.
                nullable: true
              subOrderId:
                type: string
                description: >-
                  Sub-order id associated with this payment method, if it has one.
                nullable: true
              seller    :
                type: string
                description: >-
                  Seller identifier if this payment method has one
                nullable: true
              antiFraud :
                  type: array
                  description: >-
                    An object containing all anti fraud services employed to perform risk validation for the
                    payment. Usually used for credit card methods.
                  nullable: true
                  items:
                    type: object
                    properties:
                      name  :
                        type: string
                        description: >-
                          Acquirer name.
                        nullable: true
                      serviceName   :
                        type: string
                        description: >-
                          Tuna service name.
                        nullable: true
                      status    :
                        type: string
                        description: >-
                          Status that indicates if the service call was successful or not.
                        nullable: true
                      message     :
                        type: string
                        description: >-
                          Message detailing the result of the invocation.
                        nullable: true
                      Time       :
                        type: string
                        description: >-
                          Time in which the service was called
                        nullable: true
                      Order        :
                        type: int
                        description: >-
                          Sequencial number in which the services were called
                        nullable: true
                        format: int16
                      originalResponse:
                        type: string
                        description: >-
                          Raw response returned by the antifraud service, as a
                          JSON-encoded string. Only returned when
                          **MessageDetails** is true.
                        nullable: true
              acquirer  :
                  type: array
                  description: >-
                    An object containing all acquirer services employed to process the
                    payment. It is an array becuase the payment can fail for the attempt in one service but
                    can be succesfully processed in next attempt in other service.
                  nullable: true
                  items:
                    type: object
                    properties:
                      name  :
                        type: string
                        description: >-
                          Acquirer name.
                        nullable: true
                      serviceName   :
                        type: string
                        description: >-
                          Tuna service name.
                        nullable: true
                      status    :
                        type: string
                        description: >-
                          Status that indicates if the service call was successful or not.
                        nullable: true
                      message     :
                        type: string
                        description: >-
                          Message detailing the result of the invocation.
                        nullable: true
                      Time       :
                        type: string
                        description: >-
                          Time in which the service was called
                        nullable: true
                      Order        :
                        type: int
                        description: >-
                          Sequencial number in which the services were called
                        nullable: true
                        format: int16
                      registrationKey:
                        type: string
                        description: >-
                          Acquirer registration/merchant key used for this call.
                          Only returned when **MessageDetails** is true.
                        nullable: true
                      originalResponse:
                        type: string
                        description: >-
                          Raw response returned by the acquirer, as a
                          JSON-encoded string. Only returned when
                          **MessageDetails** is true.
                        nullable: true
        items:
          type: array
          description: >-
            An object containing all payment items associated with the
            payment.
          nullable: true
          items:
            type: object
            properties:
              detailUniqueID :
                type: string
                description: >-
                  Item unique id.
                nullable: true
              sku  :
                type: string
                description: >-
                  Item product sku.
                nullable: true    
              ean   :
                type: string
                description: >-
                  Item product ean.
                nullable: true 
              amount    :
                type: number
                description: >-
                  Item amount per unit.
                format: double
              shippingAmount     :
                type: number
                description: >-
                  Item shipping amount per unit.
                format: double
                nullable: true
              discountAmount      :
                type: number
                description: >-
                  Item discount amount per unit.
                format: double
                nullable: true
              productID       :
                type: number
                description: >-
                  Item product id.
                format: int16
                nullable: true
              productUniqueID        :
                type: string
                description: >-
                  Item product identifier 
                nullable: true
              productDescription         :
                type: string
                description: >-
                  Item product identifier 
                nullable: true
              categoryID        :
                type: number
                description: >-
                  Item category id.
                format: int16
                nullable: true
              categoryName          :
                type: string
                description: >-
                  Item category description
                nullable: true
              Quantity           :
                type: number
                description: >-
                  Item quantity
                format: int16
              subOrderId           :
                type: string
                description: >-
                  Item sub-order id if it has one
                nullable: true
        code:
          type: string
          description: >-
            String code that states if the execution was successful or not.
            Equivalent to the numeric code at the level above.
            This property is being deprecated.
          nullable: true
          deprecated: true
    PaymentOptionsRequestSchema:
      type: object
      properties: &ref_420
        tokenSession:
          type: string
          description: >-
            Here use the **sessionId** created at the [Token API endpoint "New Session"
            method.](/api/token#operation/NewSession)
          nullable: false
        partnerUniqueID:
          type: string
          description: Your unique ID for the order. It is used to track the order.
          nullable: true
        customer:
          type: object
          description: >-
            This object is used to pass on **customer data**, mainly for fraud
            prevention. Also, when using a saved card, only card tokens
            belonging to the user of this customer will work.
          nullable: true
          properties:
            iD:
              type: string
              description: A string that identifies the customer.
              nullable: true
            email:
              type: string
              description: Email.
              nullable: true
            name:
              type: string
              description: Full name.
              nullable: true
            document:
              type: string
              description: Document ID.
              nullable: true
            documentType:
              type: string
              description: >-
                Document ID type (pt-br: can be either "CPF" or "CNPJ"; can also
                be "SSN" or other types).
              nullable: true
            birthDate:
              type: string
              description: Birthday in date format.
              format: date
              nullable: true
            gender:
              type: string
              description: Customer's gender.
              nullable: true
            daysSinceRegistration:
              type: integer
              description: Days since customer's registration.
              format: int16
              nullable: true
            daysSinceLastLogin:
              type: integer
              description: Days since customer's last login date.
              format: int16
              nullable: true
            daysSinceLastPasswordChange:
              type: integer
              description: Days since customer's last password change date.
              format: int16
              nullable: true
            daysSinceLastPurchase:
              type: integer
              description: Days since customer's last purchase date.
              format: int16
              nullable: true
            daysSinceFirstPurchase:
              type: integer
              description: Days since customer's first purchase date.
              format: int16
              nullable: true
            data:
              type: object
              additionalProperties: {}
              description: Any additional data used to refer to the customer.
              nullable: true
        vendor:
          type: object
          description: >-
            This object is used to pass on **vendor data**. This is mainly used
            for fraud prevention.
          nullable: true
          properties:
            email:
              type: string
              description: Email of the vendor.
              nullable: true
            phone:
              type: string
              description: Phone number of the vendor.
              nullable: true
            websiteUrl:
              type: string
              description: Vendor website URL.
              nullable: true
            mCC:
              type: string
              description: Merchant Category Code (MCC).
              nullable: true
            code:
              type: string
              description: ID or Commercial establishment of the vendor("EC" in Brazil).
              nullable: true
            name:
              type: string
              description: Name of the vendor.
              nullable: true
            industry:
              type: string
              description: The activity of the vendor.
              nullable: true
            document:
              type: string
              description: Document ID.
              nullable: true
            documentType:
              type: string
              description: >-
                Document ID type (pt-br: can be either "CPF" or "CNPJ"; can also
                be "SSN" or other types).
              nullable: true
            address:
              type: object
              description: Vendor address.
              nullable: true
              properties:
                street:
                  type: string
                  nullable: true
                number:
                  type: string
                  nullable: true
                neighborhood:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                postalCode:
                  type: string
                  nullable: true
            daysSinceRegistration:
              type: integer
              description: Days since vendor's registration (for marketplaces).
              format: int16
              nullable: true
            daysSinceLastSell:
              type: integer
              description: Days since vendor's last sale (for marketplaces).
              format: int16
              nullable: true
            daysSinceFirstSell:
              type: integer
              description: Days since vendor's first sale (for marketplaces).
              format: int16
              nullable: true
        paymentItems:
          type: object
          description: This object holds the collection of items related to this order.
          nullable: true
          properties:
            items:
              type: array
              description: An array of payment items.
              nullable: true
              items:
                type: object
                properties:
                  detailUniqueID:
                    type: string
                    description: >-
                      An ID is used to identify this item inside your order. It
                      can't be repeated inside the same order.
                    nullable: true
                  sku:
                    type: string
                    description: >-
                      A product identifier. A stock-keeping unit (SKU) is a
                      scannable bar code, most often seen printed on product
                      labels.
                    nullable: true
                  ean:
                    type: string
                    description: >-
                      Similar to SKU. The International Article Number, also
                      known as European Article Number (EAN), is a standard
                      describing a barcode symbology and numbering system. It is
                      used in global trade to identify a specific retail product
                      type, a specific packaging configuration, and a specific
                      manufacturer.
                    nullable: true
                  amount:
                    type: number
                    description: The value of each unit of this payment item.
                    format: double
                  discountAmount:
                    type: number
                    description: >-
                      This represents the discount amount to be applied to each unit of this payment item.
                      If the total sum of the items surpasses the overall amount being transacted, 
                      you should use this field to clearly indicate the discount amounts for each item.
                    format: double
                  shippingAmount:
                    type: number
                    description: >-
                      This represents the shipping cost associated with each unit of this payment item. 
                    format: double
                  productID:
                    type: integer
                    description: An internal product identifier.
                    format: int32
                    nullable: true
                  productDescription:
                    type: string
                    description: Short description of the product, e.g., white shirt.
                    nullable: true
                  categoryID:
                    type: integer
                    description: A numeric category identifier of the item category.
                    format: int32
                    nullable: true
                  categoryName:
                    type: string
                    description: The name of the item category.
                    nullable: true
                  itemQuantity:
                    type: integer
                    description: The number of units included in this item.
                    format: int16
                  split:
                    type: object
                    description: This object is required when using split payments.
                    nullable: true
                    properties:
                      merchantID:
                        type: string
                        description: Your unique ID for the merchant.
                        nullable: true
                      merchantDocument:
                        type: string
                        description: Merchant's document ID.
                        nullable: true
                      merchantDocumentType:
                        type: string
                        description: >-
                          Document ID type (pt-br: can be either "CPF" or
                          "CNPJ"; can also be "SSN" or other types).
                        nullable: true
                      percent:
                        type: number
                        description: >-
                          Percent per item to be paid to this merchant. This
                          property overrides the default split rules.
                        format: double
                        nullable: true
                      amount:
                        type: number
                        description: >-
                          Amount per item to be paid to this merchant. This
                          property overrides the default split rules.
                        format: double
                        nullable: true
                  antiFraud:
                    type: object
                    description: This object holds specific anti-fraud data.
                    nullable: true
                    properties:
                      ean:
                        type: string
                        description: Ean product code.
                        nullable: true
                      deliveryAddressee:
                        type: string
                        description: >-
                          Name of the person receiving the goods at the delivery
                          address.
                        nullable: true
                      isEmailConfirmed:
                        type: boolean
                        description: States if the customer has verified his email address.
                        nullable: true
                      wasCardChanged:
                        type: boolean
                        description: >-
                          States if the customer has attempted to buy this order
                          with a different card before.
                        nullable: true
                      isPhoneNumberConfirmed:
                        type: boolean
                        description: Whether the customer has verified his phone number.
                        nullable: true
                      loginCredential:
                        type: string
                        description: The username used to login (when logged in).
                        nullable: true
                      isVIPClient:
                        type: boolean
                        description: >-
                          States if this customer should be treated differently
                          in a positive way (i.e., belongs to an allow list).
                        nullable: true
                      isEmployeeClient:
                        type: boolean
                        description: Whether the customer is an employee of the merchant.
                        nullable: true
                      wasAccountModified:
                        type: boolean
                        description: If the account has been modified.
                        nullable: true
                      daysSinceLastAccountChange:
                        type: integer
                        description: >-
                          The number of days since the account has been
                          modified.
                        format: int16
                        nullable: true
                      fidelityNumber:
                        type: string
                        description: The fidelity number (when applied to this purchase).
                        nullable: true
                      daysSinceFidelityRegistration:
                        type: integer
                        description: The number of days since the fidelity card was issued.
                        format: int16
                        nullable: true
                      daysSinceLastPointsExchange:
                        type: integer
                        description: >-
                          The number of days since the fidelity card points were
                          last used.
                        format: int16
                        nullable: true
                      fidelityBalance:
                        type: integer
                        description: Balance available at the fidelity card.
                        format: int32
                        nullable: true
                      amountPointsLastExchange:
                        type: integer
                        description: Amount of fidelity points used last time.
                        format: int32
                        nullable: true
                      phoneChargesInLast30Days:
                        type: integer
                        description: >-
                          The number of recharges made to a prepaid phone number
                          in the last 30 days.
                        format: int16
                        nullable: true
                      minutesChargedInLast30Days:
                        type: integer
                        description: >-
                          The number of minutes charged to a prepaid phone
                          number in the last 30 days.
                        format: int16
                        nullable: true
                      data:
                        type: object
                        description: >-
                          An array of generic key-value pairs to input any
                          additional anti-fraud data.
                        nullable: true
                        properties:
                          key:
                            type: string
                            description: Dictionary key.
                          value:
                            type: string
                            description: Dictionary value.
                  presentMessage:
                    type: string
                    description: >-
                      "Present" or "gift" message. Usually a message associated
                      with a gift card.
                    nullable: true
        paymentData:
          type: object
