  /api/Payment/Status:
    post:
      summary: Status
      description: |
        Retrieve the status of a transaction.

        If all callbacks are implemented
        properly, and uptime is ensured, then the payment status between client
        applications and the payment gateway should be synchronized. However,
        should all callbacks (such as to notify the client application when a
        transation has been cancelled using the web console) not be implemented,
        it is possible for the statuses to be different. In that case, this API
        call will retrieve the current status.
      operationId: Status
      parameters:
        - in: header
          name: x-tuna-account
          required: true
          schema:
            description: The name of your account.
            type: string
        - in: header
          name: x-tuna-apptoken
          required: true
          schema:
            description: The app token associated with your account.
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: *ref_50
            examples:
              Template:
                summary: Example Template
                value: *ref_51
              Cancelled:
                summary: Cancelled
                value: *ref_52
              PartialRefunded:
                summary: Partial Refunded
                value: *ref_53
              MessageDetails:
                summary: With MessageDetails
                value: *ref_137
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: *ref_54
              examples:
                Template:
                  summary: Example Template
                  value: *ref_55
                SCancelledample:
                  summary: Cancelled
                  value: *ref_56
                PartialRefunded:
                  summary: Partial Refunded
                  value: *ref_57
                MessageDetails:
                  summary: With MessageDetails
                  value: *ref_138
