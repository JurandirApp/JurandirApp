                  format: int32
                  nullable: true
                phoneChargesInLast30Days:
                  type: integer
                  description: >-
                    The number of recharges made to a prepaid phone number in
                    the last 30 days.
                  format: int16
                  nullable: true
                minutesChargedInLast30Days:
                  type: integer
                  description: >-
                    The number of minutes charged to a prepaid phone number in
                    the last 30 days.
                  format: int16
                  nullable: true
                data:
                  type: object
                  description: >-
                    An array of generic key-value pairs to input any additional
                    anti-fraud data. You can also set **returnOriginalResponse**
                    to **true** here to include the raw acquirer/antifraud
                    service responses in the Init response
                    (methods[].antiFraud[].originalResponse and
                    methods[].acquirer[].originalResponse).
                  nullable: true
                  properties:
                    key:
                      type: string
                      description: Dictionary key.
                    value:
                      type: string
                      description: Dictionary value.
            deliveryAddress:
              type: object
              description: An object that contains delivery address fields.
              nullable: true
              properties:
                street:
                  type: string
                  description: Street name.
                  nullable: true
                number:
                  type: string
                  description: Building number.
                  nullable: true
                complement:
                  type: string
                  description: Address complement (e.g., apartment number).
                  nullable: true
                neighborhood:
                  type: string
                  description: Neighborhood.
                  nullable: true
                city:
                  type: string
                  description: City.
                  nullable: true
                state:
                  type: string
                  description: State.
                  nullable: true
                country:
                  type: string
                  description: Country.
                  nullable: true
                postalCode:
                  type: string
                  description: 'Postal code (pt-br: "CEP").'
                  nullable: true
                phone:
                  type: string
                  description: A string containing the phone number.
                  nullable: true
            countrycode:
              type: string
              description: Two letters ISO country code.
              nullable: false
            amount:
              type: number
              description: Total order amount.
              format: double
            salesChannel:
              type: string
              description: Origin of the purchase, e.g., web, app.
              nullable: true
            callbackUrl:
              type: string
              description: Where to notify about payment status changes. If not present, the notification will be sent to the configured at account level
              nullable: true
        frontData:
          type: object
          description: >-
            This object contains data that must be extracted from the frontend
            of the checkout page.
          nullable: true
          properties:
            sessionID:
              type: string
              description: A fingerprint ID produced by the anti-fraud being used.
              nullable: true
            ipAddress:
              type: string
              description: The ip address of the current session. It is recomended when using 3DS and/or antifraud services. 
              nullable: true
            acceptHeader:
              type: string
              description: It is recomended when using 3DS. The exact content of the HTTP accept header.
              nullable: true
            userAgent:
              type: string
              description: It is recomended when using 3DS. The exact content of the HTTP accept header.
              nullable: true
            cookiesAccepted:
              type: boolean
              description: It is recomended when using 3DS.
              nullable: true
            acceptLanguage:
              type: string
              description: It is recomended when using 3DS. Value represents the browser language as defined in IETF BCP47
              nullable: true
            colorDepth:
              type: string
              description: Value recomended the bit depth of the color palette for displaying images, in bits per pixel.
              nullable: true
            screenHeight:
              type: string
              description: It is recomended when using 3DS. Total height of the Cardholders screen in pixels, example 864.
              nullable: true
            ScreenWidth:
              type: string
              description: It is recomended when using 3DS. Total width of the Cardholders screen in pixels, example 864.
              nullable: true
            TimeDifference:
              type: string
              description: It is recomended when using 3DS. Time difference between UTC time and the cardholder browser local time, in minutes, Example 300.
              nullable: true
            JavaEnabled:
              type: boolean
              description: It is recomended when using 3DS. A Boolean value that represents the ability of the cardholder browser to execute Java.
              nullable: true
            JavaScriptEnabled:
              type: boolean
              description: It is recomended when using 3DS. A Boolean value that represents the ability of the cardholder browser to execute JavaScript.
              nullable: true
        isMerchantInitiated:
          type: boolean
          description: >-
            Indicates whether the transaction was initiated by the merchant or
            by the customer.
          nullable: true
        extraInfo:
          type: string
          description: >-
            A string containing extra information. It is used just for
            customizations.
          nullable: true
    InitResponseSchema:
      type: object
      properties: &ref_18
        status:
          type: string
          description: >-
            The overall status of a payment. Please refer to the [payment
            status reference table](/api/tuna-codes#payment-status).
          format: char
          nullable: true
        methods:
          type: array
          description: >-
            An object containing all payment methods employed to perform the
            payment. For large purchases, a customer may use multiple credit
            cards, PIX, or, Boleto to complete the payment. As such, each method
            with its status is included in the response.
          nullable: true
          items:            
            type: object
            properties:
              acquirer:
                type: array
                description: >-
                  An array containing all the acquirers/gateways involved at the attempts
                  to authorize this method.
                nullable: true
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: >-
                        The name of the acquirer/gateway as configured in at Tuna's console.
                      format: char
                      nullable: true
                    status:
                      type: string
                      description: >-
                        The status of a payment method. Please refer to the [payment
                        method status reference table](/api/tuna-codes#payment-method-status).
                      format: char
                      nullable: true
                    message:
                      type: string
                      description: >-
                        A message returned by the acquirer/gateway.
                    serviceName:
                      type: string
                      description: >-
                        Tuna service name used to call this acquirer.
                      nullable: true
                    resultId:
                      type: string
                      description: >-
                        Acquirer result/transaction identifier for this call.
                      nullable: true
                    info:
                      type: string
                      description: >-
                        Additional information returned by the acquirer.
                      nullable: true
                    originalResponse:
                      type: string
                      description: >-
                        Raw response returned by the acquirer, as a
                        JSON-encoded string. Only returned when
                        **AntiFraud.Data.ReturnOriginalResponse** is true.
                      nullable: true
                    time:
                      type: string
                      description: Time in which the acquirer was called.
                      nullable: true
                    order:
                      type: integer
                      description: Sequencial number in which the acquirers were called.
                      nullable: true
              antifraud:
                type: array
                description: >-
                  An array containing all the antifraud tools involved at the attempts
                  to approve this method.
                nullable: true
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: >-
                        The name of the antifraud tool as configured in at Tuna's console.
                      format: char
                      nullable: true
                    status:
                      type: string
                      description: >-
                        The status of the antifraud analysis.
                        Possible values are: <ol><li>"Engine"</li> <li>"A" = Approved</li>
                        <li>"U" =  Unknown</li> <li>"R" = Rejected</li><li>"I" = In Analysis/Pending Analysis</li>
                        <li>"E" = Error</li><li>"C" = Cancelled</li><li>"Z" = Configuration Error</li></ol>
                      format: char
                      nullable: true
                    message:
                      type: string
                      description: >-
                        A message returned by the antifraud tool.
                    serviceName:
                      type: string
                      description: >-
                        Tuna service name used to call this antifraud tool.
                      nullable: true
                    resultId:
                      type: string
                      description: >-
                        Antifraud tool result/evaluation identifier for this call.
                      nullable: true
                    info:
                      type: string
                      description: >-
                        Additional information returned by the antifraud tool.
                      nullable: true
                    originalResponse:
                      type: string
                      description: >-
                        Raw response returned by the antifraud tool, as a
                        JSON-encoded string. Only returned when
                        **AntiFraud.Data.ReturnOriginalResponse** is true.
                      nullable: true
                    time:
                      type: string
                      description: Time in which the antifraud tool was called.
                      nullable: true
                    order:
                      type: integer
                      description: Sequencial number in which the antifraud tools were called.
                      nullable: true
              methodType:
                type: string
                description: >-
                  A code that indicates the type of payment method. Possible
                  values are found at [payment methods reference
                  table](/api/tuna-codes#payment-methods).
                format: char
                nullable: true
              status:
                type: string
                description: >-
                  The status of a payment method. Please refer to the [payment
                  status reference table](/api/tuna-codes#payment-method-status).
                format: char
                nullable: true
              methodId:
                type: integer
                description: >-
                  A unique ID that identifies the payment method within the
                  overall payment. For instance, if two payment methods were
                  used in a given transaction, they will have IDs 0 and 1. In
                  the next transaction, if three payment methods were used, they
                  would have IDs 0, 1, and 2.
                format: int16
              operationId:
                type: string
                description: Operation identifier at Tuna.
                nullable: true
              methodKey:
                type: string
                description: Method identifier at Tuna.
                nullable: true
              antiFraudResults:
                type: object
                additionalProperties:
                  type: string
                description: >-
                  A summary map of antifraud tool name to its result (e.g.
                  "Approved"), for a quick overview of all antifraud checks.
                nullable: true
              statusAF:
                type: string
                description: >-
                  Overall antifraud status for this method. Please refer to
                  the [payment method status reference table](/api/tuna-codes#payment-method-status).
                format: char
                nullable: true
              message:
                type: object
                description: An object that contains the message fields.
                nullable: true
                properties:
                  source:
                    type: integer
                    description: >-
                      It is used to track the source of the message. Possible
                      values are: <ol><li>"Engine"</li> <li>"AntiFraud"</li>
                      <li>"Gateway"</li> <li>"Customization"</li> </ol>
                    format: int32
                  code:
                    type: string
                    description: >-
                      Numeric code that states if the execution was successful
                      or not. Positive numbers mean success; negative numbers
                      indicate failures. Please refer to the [message code
                      table](/api/tuna-codes#message-code-list) for a detailed
                      list of all possible values.
                    nullable: true
                  message:
                    type: string
                    description: >-
                      A human readable message that gives details about what the
                      code means.
                    nullable: true
                  info:
                    type: string
                    description: >-
                      When available, info gives further information about the
                      execution of the process. This shouldn't matter for
                      treating this response but can help dig information
                      afterward. For example, it might contain internal messages
                      from a payment method.
                    nullable: true
              additionalInfo:
                type: object
                additionalProperties: {}
                description: Any additional data used to refer to the payment method.
                nullable: true
              redirectInfo:
                type: object
                description: Redirect information.
                nullable: true
                properties:
                  url:
                    type: string
                    description: Link URL to be able to finish the payment transaction.
                    nullable: true
              cardInfo:
                type: object
                description: Card specific information.
                nullable: true
                properties:
                  bin:
                    type: string
                    description: A string containing card bin.
                    nullable: true
                  authorizeNsu:
                    type: string
                    description: A string containing authorize nsu.
                    nullable: true
                  transactionId:
                    type: string
                    description: A string containing transaction Id.
                    nullable: true
                  authorizeCode:
                    type: string
                    description: A string containing authorize code.
                    nullable: true
                  last4:
                    type: string
                    description: A string containing card's last 4 digits.
                    nullable: true
                  brandName:
                    type: string
                    description: A string containing card brand name.
                    nullable: true
              pixInfo:
                type: object
                description: PIX specific information.
                nullable: true
                properties:
                  qRContent:
                    type: string
                    description: A string containing QRcode.
                    nullable: true
                  qRImage:
                    type: string
                    description: A string containing the QRcode image url.
                    nullable: true
                  qrCopyPaste:
                    type: string
                    description: A string containing the QRcode copy and paste version.
                    nullable: true
              cryptoInfo:
                type: object
                description: >-
                  Specific information related to payment with crypto
                  currencies.
                nullable: true
                properties:
                  coinValue:
                    type: string
                    description: >-
                      The amount for the payment transaction in the requested
                      crypto currency.
                    nullable: true
                  coinRateCurrency:
                    type: string
                    description: >-
                      The rate currency of the crypto currency for the payment
                      transaction.
                    nullable: true
                  coinAddr:
                    type: string
                    description: >-
                      The "copy and paste" hash code related with this payment
                      transaction.
                    nullable: true
                  coinQRCodeUrl:
                    type: string
                    description: The URL of the QRcode image of this payment transaction.
                    nullable: true
                  coin:
                    type: string
                    description: >-
                      The crypto currency that is being used in the payment
                      transaction.
                    nullable: true
        paymentKey:
          type: string
          description: The unique payment transaction identifier generated by Tuna.
          nullable: true
        partnerUniqueId:
          type: string
          description: Your unique ID for the order. It is used to track the order.
